name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and build
        run: >-
          ./gradlew
          testCommunityDebugUnitTest
          testLegacyBridgeDebugUnitTest
          lintCommunityDebug
          lintLegacyBridgeDebug
          assembleCommunityDebug
          assembleLegacyBridgeDebug
          --stacktrace

      - name: Upload test APKs
        uses: actions/upload-artifact@v7
        with:
          name: bu-wan-le-test-apks
          path: |
            app/build/outputs/apk/community/debug/app-community-debug.apk
            app/build/outputs/apk/legacyBridge/debug/app-legacyBridge-debug.apk
          if-no-files-found: error
